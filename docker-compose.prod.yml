# Composição de produção.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferenças em relação ao compose de desenvolvimento:
#   - sem bind mount do código: a imagem é o artefato, e os estáticos coletados
#     durante o build não são encobertos pelo diretório do host;
#   - gunicorn no lugar do runserver (o CMD do Dockerfile);
#   - mídia em volume nomeado: uma foto perdida não volta pelo dump do Postgres;
#   - configuração vem do arquivo .env, que não é versionado.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    volumes:
      # Uploads de usuário. É o único estado da aplicação fora do Postgres,
      # e precisa entrar na rotina de backup.
      - media_data:/app/media
      # O modelo de embedding tem centenas de MB. Sem o volume, cada restart do
      # contêiner baixa tudo de novo.
      - fastembed_cache:/opt/fastembed_cache
    ports:
      - "8000:8000"
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?defina ALLOWED_HOSTS no .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # Deixe em 0 se o TLS termina em um proxy que não encaminha
      # X-Forwarded-Proto — caso contrário o redirect entra em loop.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      FASTEMBED_CACHE_PATH: /opt/fastembed_cache
    depends_on:
      db:
        condition: service_healthy

  # Mesmo agendador da configuração de desenvolvimento. Sem ele, a liberação de
  # reservas sem check-in nunca acontece em produção — que é exatamente onde ela
  # precisa acontecer.
  scheduler:
    build: .
    command: python manage.py agendador
    restart: unless-stopped
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?defina ALLOWED_HOSTS no .env}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      # O agendador não serve HTTP: sem isto o redirect para https faria a
      # checagem de deploy reclamar de um processo que nunca recebe requisição.
      SECURE_SSL_REDIRECT: "False"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  fastembed_cache:
