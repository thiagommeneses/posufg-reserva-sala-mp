services:
  db:
    # pgvector/pgvector:pg16 é o postgres:16 com a extensão vector pré-instalada.
    # ATENÇÃO: a major version é a mesma, mas a imagem base tem glibc diferente da
    # do postgres:16 oficial. Um volume inicializado pela outra imagem provoca
    # "collation version mismatch" no template1 e impede criar bancos novos —
    # inclusive o de testes. Ao trocar de imagem, recrie o volume:
    #   make down && docker volume rm reserva-sala-mp_postgres_data && make up
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py tailwind runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./.gitconfig:/root/.gitconfig:ro
      # O modelo de embedding tem centenas de MB. Sem este volume, todo build
      # descarta o download e a primeira indexação seguinte baixa tudo de novo.
      - fastembed_cache:/opt/fastembed_cache
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-docker-dev
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - FASTEMBED_CACHE_PATH=/opt/fastembed_cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  fastembed_cache:
