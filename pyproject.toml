[project]
name = "django-template"
version = "0.1.0"
description = "Django project template with uv, pytest, Docker, and developer tooling"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg2-binary",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "pre-commit",
    "conventional-pre-commit",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
