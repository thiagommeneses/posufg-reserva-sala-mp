[project]
name = "django-template"
version = "0.2.0"
description = "Django project template with uv, pytest, Docker, and developer tooling"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg2-binary",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "conventional-pre-commit",
    "commitizen",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".agents/skills/skill-creator/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C90", "D", "S", "ASYNC", "PERF", "T20", "RET", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101"]
"**/test_*.py" = ["S101"]
"**/*_tests.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.commitizen]
version = "0.2.0"
tag_format = "v$version"
version_files = ["pyproject.toml:version"]
