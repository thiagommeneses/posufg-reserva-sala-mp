{% extends "base.html" %}
{% load static %}

{% block title %}Entrar — Reserva de Espaços{% endblock %}

{% block content %}
<div class="hero min-h-screen bg-gradient-to-b from-base-200 to-base-300">
    <div class="hero-content flex-col">
        <div class="flex flex-col items-center gap-2 mb-2">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-16 w-16" style="width: 100px; height: auto;">
            <br>
            <h1 class="text-lg font-semibold text-base-content/80 tracking-wide">Reserva de Espaços</h1>
        </div>
        <div class="card w-full max-w-sm bg-base-100 border border-base-300 shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-2xl mb-4">LOGIN</h2>
                <form method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    <div class="form-control mb-3">
                        <label class="label" for="id_username">
                            <span class="label-text">Usuário</span>
                        </label>
                        <input type="text" name="username" id="id_username"
                               class="input input-bordered w-full {% if form.username.errors %}input-error{% endif %}"
                               value="{{ form.username.value|default:'' }}" required autofocus>
                        {% if form.username.errors %}
                            <label class="label">
                                <span class="label-text-alt text-error">{{ form.username.errors.0 }}</span>
                            </label>
                        {% endif %}
                    </div>
                    <div class="form-control mb-6">
                        <label class="label" for="id_password">
                            <span class="label-text">Senha</span>
                        </label>
                        <input type="password" name="password" id="id_password"
                               class="input input-bordered w-full {% if form.password.errors %}input-error{% endif %}"
                               required>
                        {% if form.password.errors %}
                            <label class="label">
                                <span class="label-text-alt text-error">{{ form.password.errors.0 }}</span>
                            </label>
                        {% endif %}
                    </div>
                    <div class="form-control">
                        <button type="submit" class="btn btn-primary w-full">Entrar</button>
                    </div>
                </form>
                <div class="mt-4 text-center">
                    <a href="{% url 'accounts:register' %}" class="link link-primary">Criar conta</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
