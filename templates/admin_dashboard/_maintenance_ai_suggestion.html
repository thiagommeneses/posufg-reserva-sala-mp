{% if ai_error %}
<div class="notice notice-error mt-2">
    <span>{{ ai_error }}</span>
</div>
{% elif classification %}
<div class="notice mt-2">
    <span>
        <span class="font-medium">Categoria sugerida:</span> {{ classification.category }}
        <span class="badge badge-ghost badge-sm ml-1 font-normal">confiança: {{ classification.confidence }}</span>
        <br>
        <span class="text-base-content/70">{{ classification.justification }}</span>
    </span>
</div>
{% endif %}
