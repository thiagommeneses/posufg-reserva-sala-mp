<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
    {% for card in space_cards %}
    <article class="surface p-4 sm:p-5 flex flex-col gap-2">
        <div class="flex items-start justify-between gap-3">
            <h3 class="font-semibold text-sm leading-snug">{{ card.name }}</h3>
            <span class="badge badge-outline badge-sm font-normal shrink-0 {{ card.status_class }}">{{ card.status_label }}</span>
        </div>
        <p class="text-sm text-muted">{{ card.location }}</p>
        <div class="flex flex-wrap gap-1 mt-auto pt-1">
            <span class="badge badge-ghost badge-sm font-normal">{{ card.capacity }} lugares</span>
            {% if not card.is_active %}
            <span class="badge badge-ghost badge-sm font-normal text-muted">Inativo</span>
            {% endif %}
        </div>
    </article>
    {% empty %}
    <div class="col-span-full">
        <div class="notice">
            <span>Nenhum espaço cadastrado.</span>
        </div>
    </div>
    {% endfor %}
</div>
