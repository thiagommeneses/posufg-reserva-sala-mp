<span hx-patch="{% url 'admin_dashboard:space_toggle' space.pk %}"
      hx-trigger="click"
      hx-swap="outerHTML"
      hx-indicator="find .spinner"
      class="inline-flex items-center cursor-pointer"
      title="Clique para alternar">
    {% if space.is_active %}
    <span class="badge badge-outline badge-sm border-success/40 text-success font-normal">Ativo</span>
    {% else %}
    <span class="badge badge-ghost badge-sm font-normal text-muted">Inativo</span>
    {% endif %}
    <span class="spinner htmx-indicator loading loading-spinner loading-xs ml-1"></span>
</span>
