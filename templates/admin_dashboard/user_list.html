{% extends "base_admin.html" %}

{% block admin_content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Gestão de Usuários</h1>
    <a href="{% url 'admin_dashboard:user_create' %}" class="btn btn-primary">Novo Usuário</a>
</div>

<div class="overflow-x-auto">
    <table class="table table-zebra w-full">
        <thead>
            <tr>
                <th>Usuário</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for user_obj in users %}
            {% include "admin_dashboard/_user_row.html" %}
            {% empty %}
            <tr>
                <td colspan="5" class="text-center py-4">Nenhum usuário encontrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
