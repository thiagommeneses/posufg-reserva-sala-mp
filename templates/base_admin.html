{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="drawer lg:drawer-open">
    <input id="admin-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content flex flex-col min-h-screen bg-base-200">
        <div class="navbar min-h-14 bg-base-100 border-b border-base-300 px-3 sm:px-4 lg:hidden gap-2">
            <div class="flex-none">
                <label for="admin-drawer" class="btn btn-square btn-ghost btn-sm" aria-label="Abrir menu">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="h-5 w-5 stroke-current" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </label>
            </div>
            <div class="flex-1 min-w-0">
                <a href="/admin-dashboard/" class="inline-flex items-center gap-2 min-w-0">
                    <img
                        src="{% static 'img/logo.png' %}"
                        alt="Logo do Ministério Público do Estado de Goiás"
                        class="brand-logo h-8"
                        width="32"
                        height="32"
                        decoding="async"
                    >
                    <span class="brand-font text-lg truncate">Admin</span>
                </a>
            </div>
        </div>
        <main class="flex-1 p-3 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
    <div class="drawer-side z-40">
        <label for="admin-drawer" class="drawer-overlay lg:hidden" aria-label="Fechar menu"></label>
        <aside class="bg-base-100 min-h-full w-64 border-r border-base-300 flex flex-col p-4">
            <div class="flex items-center gap-3 px-2 mb-6 min-w-0">
                <img
                    src="{% static 'img/logo.png' %}"
                    alt=""
                    class="brand-logo h-10"
                    width="40"
                    height="40"
                    decoding="async"
                >
                <div class="min-w-0">
                    <p class="brand-font text-lg leading-tight">Admin</p>
                    <p class="text-xs text-base-content/50 truncate">Olá, {{ request.user.username }}</p>
                </div>
            </div>
            <nav class="flex flex-col gap-0.5 flex-1">
                <a href="/admin-dashboard/" class="sidebar-link {% if request.path == "/admin-dashboard/" %}sidebar-link-active{% endif %}">Dashboard</a>
                <a href="/admin-dashboard/spaces/" class="sidebar-link {% if "/admin-dashboard/spaces/" in request.path %}sidebar-link-active{% endif %}">Espaços</a>
                <a href="/admin-dashboard/reservations/" class="sidebar-link {% if "/admin-dashboard/reservations/" in request.path %}sidebar-link-active{% endif %}">Reservas</a>
                <a href="/admin-dashboard/maintenance/" class="sidebar-link {% if "/admin-dashboard/maintenance/" in request.path %}sidebar-link-active{% endif %}">Manutenção</a>
                <a href="/admin-dashboard/users/" class="sidebar-link {% if "/admin-dashboard/users/" in request.path %}sidebar-link-active{% endif %}">Usuários</a>
            </nav>
            <div class="pt-4 mt-4 border-t border-base-300">
                <a href="/" class="sidebar-link">Voltar ao Site</a>
            </div>
        </aside>
    </div>
</div>
{% endblock %}
