{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="drawer lg:drawer-open">
    <input id="admin-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content flex flex-col">
        <div class="navbar bg-base-100 border-b border-base-300 lg:hidden">
            <div class="flex-none">
                <label for="admin-drawer" class="btn btn-square btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-6 w-6 stroke-current">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </label>
            </div>
            <div class="flex-1">
                <a href="/admin-dashboard/" class="btn btn-ghost text-xl gap-2">
                    <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-8 w-8">
                    Admin Dashboard
                </a>
            </div>
        </div>
        <main class="p-4 lg:p-8">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
    <div class="drawer-side">
        <label for="admin-drawer" class="drawer-overlay lg:hidden"></label>
        <ul class="menu bg-base-200 min-h-full w-80 p-4">
            <li class="menu-title mb-2">
                <div class="flex items-center gap-2 normal-case">
                    <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-8 w-8">
                    <div class="flex flex-col">
                        <span class="text-base font-bold text-base-content">Admin</span>
                        <span class="text-xs opacity-70">Olá, {{ request.user.username }}</span>
                    </div>
                </div>
            </li>
            <li><a href="/admin-dashboard/" class="{% if request.path == "/admin-dashboard/" %}menu-active{% endif %}">Dashboard</a></li>
            <li><a href="/admin-dashboard/spaces/" class="{% if "/admin-dashboard/spaces/" in request.path %}menu-active{% endif %}">Espaços</a></li>
            <li><a href="/admin-dashboard/reservations/" class="{% if "/admin-dashboard/reservations/" in request.path %}menu-active{% endif %}">Reservas</a></li>
            <li><a href="/admin-dashboard/maintenance/" class="{% if "/admin-dashboard/maintenance/" in request.path %}menu-active{% endif %}">Manutenção</a></li>
            <li><a href="/admin-dashboard/users/" class="{% if "/admin-dashboard/users/" in request.path %}menu-active{% endif %}">Usuários</a></li>
            <li class="mt-auto">
                <a href="/">Voltar ao Site</a>
            </li>
        </ul>
    </div>
</div>
{% endblock %}
