{% extends "base.html" %}

{% block content %}
<div class="drawer drawer-end">
    <input id="user-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content flex flex-col">
        <div class="navbar bg-base-100 shadow-sm">
            <div class="flex-1">
                <a href="/" class="btn btn-ghost text-xl">Reserva de Espaços</a>
            </div>
            <div class="flex-none hidden md:flex">
                <ul class="menu menu-horizontal px-1">
                    <li><a href="/spaces/">Espaços</a></li>
                    <li><a href="/reservations/">Minhas Reservas</a></li>
                    <li>
                        <form method="post" action="/accounts/logout/" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-ghost btn-sm">Sair</button>
                        </form>
                    </li>
                </ul>
            </div>
            <div class="flex-none md:hidden">
                <label for="user-drawer" class="btn btn-square btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-6 w-6 stroke-current">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </label>
            </div>
        </div>
        <main class="container mx-auto px-4 py-8">
            {% block user_content %}{% endblock %}
        </main>
    </div>
    <div class="drawer-side md:hidden">
        <label for="user-drawer" class="drawer-overlay"></label>
        <ul class="menu bg-base-200 min-h-full w-80 p-4">
            <li><a href="/spaces/">Espaços</a></li>
            <li><a href="/reservations/">Minhas Reservas</a></li>
            <li>
                <form method="post" action="/accounts/logout/">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-ghost">Sair</button>
                </form>
            </li>
        </ul>
    </div>
</div>
{% endblock %}
