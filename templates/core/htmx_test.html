{% extends "base.html" %}

{% block title %}HTMX Test{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-4">HTMX Test Page</h1>
    <div id="htmx-test-target" class="p-4">
        <p>Click the button below to test HTMX partial swap.</p>
    </div>
    <button
        class="btn btn-primary mt-4"
        hx-get="/htmx-test/"
        hx-target="#htmx-test-target"
        hx-swap="innerHTML">
        Test HTMX
    </button>
</div>
{% endblock %}
