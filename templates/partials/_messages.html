{% if messages %}
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full px-4 sm:px-0" id="message-container">
    {% for message in messages %}
    <div
        class="notice shadow-sm
        {% if message.tags == 'error' %}notice-error{% elif message.tags == 'success' %}notice-success{% elif message.tags == 'warning' %}notice-warning{% endif %}"
        role="alert"
    >
        <span class="flex-1">{{ message }}</span>
        <button type="button" class="btn btn-ghost btn-xs shrink-0 inline-flex items-center" onclick="this.parentElement.remove()" aria-label="Fechar">
            {% include "partials/_icon.html" with name="x" %}
        </button>
    </div>
    {% endfor %}
</div>
<script>
    setTimeout(() => {
        const container = document.getElementById('message-container');
        if (container) {
            container.querySelectorAll('.notice').forEach((alert, index) => {
                setTimeout(() => alert.remove(), index * 200);
            });
        }
    }, 5000);
</script>
{% endif %}
