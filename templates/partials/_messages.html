{% if messages %}
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2" id="message-container">
    {% for message in messages %}
    <div class="alert
        {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-success{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'info' %}alert-info{% else %}alert-info{% endif %}
        shadow-lg"
        role="alert">
        <span>{{ message }}</span>
        <button type="button" class="btn btn-ghost btn-xs" onclick="this.parentElement.remove()">×</button>
    </div>
    {% endfor %}
</div>
<script>
    setTimeout(() => {
        const container = document.getElementById('message-container');
        if (container) {
            container.querySelectorAll('.alert').forEach((alert, index) => {
                setTimeout(() => alert.remove(), index * 200);
            });
        }
    }, 5000);
</script>
{% endif %}
